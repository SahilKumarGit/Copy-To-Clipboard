name: Build and Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

# Never let two pushes race to publish the same release
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-mac:
    name: Build macOS (Apple Silicon & Intel)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      # Universal binary: the runner is Apple Silicon, but the x64 build ships the same helper to Intel Macs
      - name: Compile native macOS paste helper
        run: |
          mkdir -p bin
          clang -arch arm64 -arch x86_64 -Wall -Wextra -Werror -Wno-deprecated-declarations -framework ApplicationServices -framework Cocoa -framework Carbon native/paste-helper-mac.m -o bin/paste-helper-mac
          chmod +x bin/paste-helper-mac
          lipo -info bin/paste-helper-mac

      - name: Package macOS Application (.dmg, .zip and .tar.xz for arm64 & x64)
        run: |
          npx electron-builder --mac dmg zip tar.xz --arm64 --x64 --publish never

      - name: Stage macOS Artifacts
        run: |
          mkdir -p mac-artifacts
          cp dist/*.dmg mac-artifacts/
          cp dist/*-mac.zip mac-artifacts/
          cp dist/*-mac.tar.xz mac-artifacts/
          ls -lh mac-artifacts/

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-artifacts
          path: mac-artifacts/*
          if-no-files-found: error

  build-linux:
    name: Build Linux (tar.xz, AppImage, deb)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Package Linux Application
        run: |
          npx electron-builder --linux tar.xz AppImage deb --publish never

      - name: Stage Linux Artifacts
        run: |
          mkdir -p linux-artifacts
          cp dist/*.AppImage linux-artifacts/
          cp dist/*.tar.xz linux-artifacts/
          cp dist/*.deb linux-artifacts/
          ls -lh linux-artifacts/

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: linux-artifacts/*
          if-no-files-found: error

  release:
    name: Publish Release Version
    needs: [build-mac, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read Version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      # Only publish when package.json has a new version; otherwise the push would overwrite the
      # assets of an existing release whose tag still points at an older commit.
      - name: Skip if release tag already exists
        id: guard
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null; then
            echo "Tag ${{ steps.version.outputs.tag }} already exists - bump the version in package.json to publish a release."
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Download all compiled artifacts
        if: steps.guard.outputs.exists == 'false'
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate Checksums
        if: steps.guard.outputs.exists == 'false'
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        if: steps.guard.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Clipboard Manager ${{ steps.version.outputs.tag }}"
          files: release-assets/*
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
