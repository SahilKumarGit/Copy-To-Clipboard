name: Build and Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mac:
    name: Build macOS (Apple Silicon & Intel)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Compile native macOS paste helper
        run: |
          mkdir -p bin
          clang -Wall -Wextra -Werror -Wno-deprecated-declarations -framework ApplicationServices -framework Cocoa -framework Carbon native/paste-helper-mac.m -o bin/paste-helper-mac
          chmod +x bin/paste-helper-mac

      - name: Package macOS Application (.dmg and .zip for arm64 & x64)
        run: |
          npx electron-builder --mac dmg zip --arm64 --x64 --publish never

      - name: Stage macOS Artifacts
        run: |
          mkdir -p mac-artifacts
          cp dist/*.dmg mac-artifacts/ 2>/dev/null || true
          cp dist/*-mac.zip mac-artifacts/ 2>/dev/null || true
          ls -lh mac-artifacts/

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-artifacts
          path: mac-artifacts/*

  build-linux:
    name: Build Linux (AppImage, tar.gz, deb)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Package Linux Application
        run: |
          npx electron-builder --linux AppImage tar.gz deb --publish never

      - name: Stage Linux Artifacts
        run: |
          mkdir -p linux-artifacts
          cp dist/*.AppImage linux-artifacts/ 2>/dev/null || true
          cp dist/*.tar.gz linux-artifacts/ 2>/dev/null || true
          cp dist/*.deb linux-artifacts/ 2>/dev/null || true
          ls -lh linux-artifacts/

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: linux-artifacts/*

  release:
    name: Publish Release Version
    needs: [build-mac, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Read Version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Download all compiled artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt || true
          cat SHA256SUMS.txt

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Clipboard Manager ${{ steps.version.outputs.tag }}"
          files: release-assets/*
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
